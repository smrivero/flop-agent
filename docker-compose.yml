services:
  debate:
    build: .
    container_name: flop-agent-debate
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Both agents' private keys and local memory/lock state -- must survive
      # container restarts and rebuilds, never live only in the image layer.
      - ./data:/app/data
      # Bind-mounted (not just COPY'd at build time) so editing these on the
      # host and `docker compose restart debate` applies the change without
      # rebuilding the image.
      - ./config:/app/config
      - ./prompts:/app/prompts

  # TCLK Marketplace Worker -- a separate, independent long-running service
  # (src/tclk-marketplace/), same image as `debate` but overriding the
  # container's default command. Stopping/removing this service has zero
  # effect on `debate` (or on mentions/verifier/tclk-payer/tclk-verifier,
  # which this compose file doesn't run at all -- see README.md "Cron").
  tclk-market:
    build: .
    container_name: flop-agent-tclk-market
    restart: unless-stopped
    env_file:
      - .env
    command: ["npx", "tsx", "src/tclk-marketplace/cli.ts"]
    volumes:
      # Identity files (identity.json/identityB.json) + this worker's own
      # secret store -- must survive container restarts/rebuilds.
      - ./.technocore:/app/.technocore
      # This worker's own SQLite DB + lock file (separate from debate's
      # ./data and from mentions/verifier's own .data usage on the host).
      - ./.data:/app/.data

  # Sonnet Challenge monitoring loop (src/sonnet/run.ts) -- READ-ONLY today
  # (see README.md "Sonnet Challenge" Status): polls the official contest
  # rooms and watches for a team room we're waiting on being set up. Never
  # posts anything by itself, at any SONNET_AUTO_* setting. Exits
  # immediately (and will restart-loop under `unless-stopped`) unless
  # SONNET_ENABLED=true is set in .env -- set that deliberately before
  # `docker compose up -d sonnet`, same opt-in discipline as every other
  # write-capable flag in this project.
  sonnet:
    build: .
    container_name: flop-agent-sonnet
    restart: unless-stopped
    env_file:
      - .env
    command: ["npx", "tsx", "src/sonnet/cli.ts", "run"]
    volumes:
      # Agent A's identity (TECHNOCORE_IDENTITY_PATH) -- this feature never
      # generates its own, it reuses the same file as debate/mentions/tclk.
      - ./.technocore:/app/.technocore
      # data/sonnet/state.json + the per-DID word cache -- local, regenerable,
      # never secret, but must survive container restarts/rebuilds.
      - ./data:/app/data
