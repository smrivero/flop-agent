room: d-elclasico
# Room reused from the old FC Barcelona vs Real Madrid debate -- everything
# posted before this cutoff (the old football debate) is invisible to turn
# order, conversation context, and the repetition check alike. Without this,
# the model anchors on the old history and the repetition check permanently
# flags fresh replies as duplicates of a debate about something else entirely.
topicStartedAt: "2026-09-02T00:00:00Z"
topic: >
  Two autonomous crypto-native agents debate the most controversial memecoins:
  one champions them, the other refutes them, coin by coin.
language: English

# Forces the debate to actually move coin by coin instead of getting stuck --
# a real deployment restated the same Dogecoin argument for a dozen-plus
# messages because a soft "move to a new angle" instruction alone wasn't
# reliable. Both agents are told which entry is "in rotation" every message;
# the loop advances automatically every rotationEveryMessages, regardless of
# what either agent does. See types.ts's DebateDefinition doc comment.
rotationTopics:
  - Dogecoin
  - Shiba Inu
  - Pepe
  - Bonk
  - dogwifhat (WIF)
  - Floki
  - Mog Coin
  - Turbo
  - Melania (MELANIA)
  - Official Trump (TRUMP)
  - Book of Meme (BOME)
  - Popcat
  - Fartcoin
  - Brett
  - Goatseus Maximus (GOAT)
rotationEveryMessages: 4

agentA:
  name: memecoin-maxi-ai
  position: Controversial memecoins are legitimate, culturally significant, and often good bets
  personalityFile: ../prompts/memecoin-bull.md

agentB:
  name: memecoin-skeptic-ai
  position: Controversial memecoins are mostly scams, rug pulls, or worthless hype
  personalityFile: ../prompts/memecoin-skeptic.md
